<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wish2Shelf Prototype</title>
<script>
  // On a real phone, skip the frame and open the app full screen.
  if (window.matchMedia("(max-width: 600px)").matches) {
    location.replace("app.html?v=" + Date.now() + location.hash);
  }
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700&display=swap">
<style>
  :root{ --page:#1B1C1E; --chip:#2A2C2F; --chip-on:#F4F5F2; --text:#E9EAE6; --muted:#9A9C98; --accent:#B4EE32; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--page);color:var(--text);font-family:"Figtree",system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:16px;overflow:hidden}

  .controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
  .seg{display:flex;background:var(--chip);border-radius:999px;padding:4px}
  .seg button{border:0;background:transparent;color:var(--muted);font:600 14px/1 "Figtree",system-ui,sans-serif;padding:10px 16px;border-radius:999px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--chip-on);color:#17200F}
  .seg button:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .icon-btn{border:0;background:var(--chip);color:var(--muted);font:600 14px/1 "Figtree",system-ui,sans-serif;padding:12px 16px;border-radius:999px;cursor:pointer;text-decoration:none}
  .icon-btn:hover{color:var(--text)}

  /* Phone: 390 × 844 screen inside a 14px bezel, scaled to fit the window. */
  .stage{width:calc(418px * var(--s,1));height:calc(872px * var(--s,1));flex:none}
  .phone{width:418px;height:872px;transform:scale(var(--s,1));transform-origin:top left;position:relative;border-radius:64px;background:#0A0A0B;padding:14px;
    box-shadow:0 0 0 2px #3A3B3F, 0 0 0 5px #121315, 0 40px 80px rgba(0,0,0,.55)}
  .phone::before,.phone::after{content:"";position:absolute;width:4px;border-radius:2px;background:#2C2D30}
  .phone::before{left:-7px;top:150px;height:64px;box-shadow:0 84px 0 #2C2D30}
  .phone::after{right:-7px;top:210px;height:96px}
  .screen{position:relative;width:390px;height:844px;border-radius:50px;overflow:hidden;background:var(--app-bg,#F6F8F0);display:flex;flex-direction:column}

  .status{flex:none;height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 32px 0 46px;color:var(--app-ink,#17200F);font:600 17px/1 -apple-system,"SF Pro Text","Figtree",system-ui,sans-serif;background:var(--app-bg,#F6F8F0);position:relative;z-index:2}
  .status .icons{display:flex;gap:6px;align-items:center}
  .island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:124px;height:36px;border-radius:20px;background:#000;z-index:3}
  iframe{flex:1;width:100%;border:0;display:block;background:var(--app-bg,#F6F8F0)}
  .home-bar{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);width:136px;height:5px;border-radius:3px;background:var(--app-ink,#17200F);opacity:.85;pointer-events:none;z-index:3}

  .hint{font-size:13px;color:var(--muted);margin:0;text-align:center}
</style>
</head>
<body>
  <div class="controls">
    <div class="seg" role="group" aria-label="Demo view">
      <button type="button" data-mode="modeStudent" aria-pressed="true">Student app</button>
      <button type="button" data-mode="modeOps" aria-pressed="false">Operator console</button>
    </div>
    <button type="button" class="icon-btn" id="reset" title="Reset the demo data">Reset demo</button>
  </div>

  <div class="stage" id="stage">
    <div class="phone">
      <div class="screen">
        <div class="island" aria-hidden="true"></div>
        <div class="status" aria-hidden="true">
          <span id="clock">9:41</span>
          <span class="icons">
            <svg width="18" height="12" viewBox="0 0 18 12"><g fill="currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></g></svg>
            <svg width="17" height="12" viewBox="0 0 17 12"><path fill="currentColor" d="M8.5 2.3c2.4 0 4.6.9 6.2 2.5l1.2-1.2C14 1.7 11.4.6 8.5.6S3 1.7 1.1 3.6l1.2 1.2C3.9 3.2 6.1 2.3 8.5 2.3zm0 3.4c1.5 0 2.8.6 3.8 1.5l1.2-1.2C12.2 4.7 10.4 4 8.5 4S4.8 4.7 3.5 6l1.2 1.2c1-.9 2.3-1.5 3.8-1.5zm0 3.4c.6 0 1.1.2 1.5.6L8.5 11.2 7 9.7c.4-.4.9-.6 1.5-.6z"/></svg>
            <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="currentColor" opacity=".4"/><rect x="2" y="2" width="20" height="9" rx="2" fill="currentColor"/><path d="M25 4.5v4c.8-.3 1.3-1.1 1.3-2s-.5-1.7-1.3-2z" fill="currentColor" opacity=".45"/></svg>
          </span>
        </div>
        <iframe id="app" title="Wish2Shelf prototype" src="app.html"></iframe>
        <div class="home-bar" aria-hidden="true"></div>
      </div>
    </div>
  </div>

  <p class="hint">Clickable prototype · demo data resets on reload · <a href="app.html" style="color:inherit">open without the frame</a></p>

<script>
  const frame = document.getElementById("app");
  frame.src = "app.html?v=" + Date.now() + location.hash;  // always load the newest version

  // Fit the phone to the window height.
  function fit(){
    const s = Math.min(1, (window.innerHeight - 130) / 872, (window.innerWidth - 32) / 418);
    document.getElementById("stage").style.setProperty("--s", Math.max(s, 0.45));
  }
  fit(); addEventListener("resize", fit);

  // Live clock in the status bar.
  function tick(){
    const d = new Date();
    document.getElementById("clock").textContent = d.getHours() + ":" + String(d.getMinutes()).padStart(2, "0");
  }
  tick(); setInterval(tick, 15000);

  // Outside buttons drive the app's own (hidden) demo bar.
  const modeBtns = document.querySelectorAll("[data-mode]");
  modeBtns.forEach(b => b.addEventListener("click", () => {
    const target = frame.contentDocument && frame.contentDocument.getElementById(b.dataset.mode);
    if (target) target.click();
  }));

  function sync(){
    const doc = frame.contentDocument; if (!doc) return;
    modeBtns.forEach(b => {
      const t = doc.getElementById(b.dataset.mode);
      if (t) b.setAttribute("aria-pressed", t.getAttribute("aria-pressed"));
    });
    // Match the status bar to the app's light or dark theme.
    const cs = frame.contentWindow.getComputedStyle(doc.documentElement);
    const bg = cs.getPropertyValue("--bg").trim(), ink = cs.getPropertyValue("--ink").trim();
    if (bg) document.documentElement.style.setProperty("--app-bg", bg);
    if (ink) document.documentElement.style.setProperty("--app-ink", ink);
    // Keep the page link in step with the app (so #tc07 / #operator can be shared).
    const h = frame.contentWindow.location.hash;
    if (h !== location.hash) history.replaceState(null, "", h || location.pathname);
  }

  frame.addEventListener("load", () => {
    sync();
    new frame.contentWindow.MutationObserver(sync).observe(frame.contentDocument.body, {subtree:true, attributes:true, attributeFilter:["aria-pressed"]});
    frame.contentWindow.addEventListener("hashchange", sync);
  });

  document.getElementById("reset").addEventListener("click", () => {
    frame.contentWindow.location.reload();
  });
</script>
</body>
</html>
