<title>Wish Cabinet Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: student app = one phone-width column (max 440px): home → category → brand → confirm → done, with "type it" and "photo" fallbacks. Operator console = wider column (max 1080px) drilling down all locations → location → cabinet. A thin demo bar switches between them. */
:root{
  --page:#E6EBDA; --bg:#F6F8F0; --surface:#FFFFFF; --surface-2:#EEF2E4; --line:#DCE3CF;
  --ink:#17200F; --muted:#56644B; --accent:#B4EE32; --accent-ink:#17200F; --accent-strong:#3B7300;
  --wish:#D9265F; --wish-soft:#FCE7EE; --ok:#2F7D32; --ok-soft:#E3F3DF; --warn:#A35C00; --warn-soft:#FBEEDB;
  --heat:150,205,30;
  --f-display:"Bricolage Grotesque","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-body:"Figtree","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0B0F09; --bg:#121810; --surface:#1A2217; --surface-2:#222C1E; --line:#2E3A29;
  --ink:#EDF2E5; --muted:#A6B39B; --accent:#C2F54C; --accent-ink:#121810; --accent-strong:#C2F54C;
  --wish:#FF6E9B; --wish-soft:#3A1A26; --ok:#8BD98E; --ok-soft:#1D3220; --warn:#F5B65C; --warn-soft:#3A2A14; --heat:170,230,60; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0B0F09; --bg:#121810; --surface:#1A2217; --surface-2:#222C1E; --line:#2E3A29;
  --ink:#EDF2E5; --muted:#A6B39B; --accent:#C2F54C; --accent-ink:#121810; --accent-strong:#C2F54C;
  --wish:#FF6E9B; --wish-soft:#3A1A26; --ok:#8BD98E; --ok-soft:#1D3220; --warn:#F5B65C; --warn-soft:#3A2A14; --heat:170,230,60; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);display:flex;flex-direction:column}
.app.wide{max-width:1080px}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent-strong);outline-offset:2px;border-radius:10px}

.demobar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:8px;background:var(--ink);color:var(--bg);font-size:12.5px;flex-wrap:wrap}
.demobar span{font-weight:700;letter-spacing:1px;text-transform:uppercase;opacity:.8}
.seg{display:flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:inherit;padding:5px 12px;border-radius:999px;font-size:12.5px;font-weight:600;opacity:.75}
.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);opacity:1}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:34px;height:34px;border-radius:11px;background:var(--accent);display:grid;place-items:center;flex:none;border:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:18px;letter-spacing:-.2px;display:block}
.brand small{display:block;font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
.lang{display:flex;background:var(--surface-2);border-radius:999px;padding:3px;flex:none}
.lang button{border:0;background:transparent;padding:6px 12px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

main{flex:1;display:flex;flex-direction:column;gap:20px;padding-block:20px 28px}
h1{font-family:var(--f-display);font-weight:800;font-size:40px;line-height:1.02;letter-spacing:-1px;margin:0;text-wrap:balance}
h1 em{font-style:normal;color:var(--wish)}
h2{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1.1;letter-spacing:-.4px;margin:0;text-wrap:balance}
h3{margin:0;font-size:16px;font-weight:700}
.lead{color:var(--muted);margin:8px 0 0;max-width:42ch}
.fine{font-size:12.5px;color:var(--muted);margin:0}
.step-tag{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}

.btn{border:0;border-radius:16px;padding:15px 18px;font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .12s ease;text-align:center}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--wish);color:#fff}
.btn.primary[disabled]{opacity:.45;cursor:default}
.btn.lime{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.outline{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn.small{padding:10px 14px;font-size:14px;border-radius:12px;width:auto}
.btn.demo{background:transparent;border:1.5px dashed var(--line);color:var(--muted);font-size:14px}
.row-btns{display:flex;gap:10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.icon{width:44px;height:44px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;flex:none;overflow:hidden}
.icon svg{width:26px;height:26px}
.icon img{width:100%;height:100%;object-fit:cover}
.meta{min-width:0}
.meta b{display:block;font-size:15px;font-weight:600;line-height:1.25}
.meta small{display:block;color:var(--muted);font-size:12.5px}
.bar{height:7px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:7px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent-strong));transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar.done i{background:var(--ok)}
.count{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.wish-btn{border:1.5px solid var(--wish);background:transparent;color:var(--wish);font-weight:700;font-size:13.5px;padding:7px 12px;border-radius:999px;white-space:nowrap}
.wish-btn[disabled]{border-color:var(--line);color:var(--muted);cursor:default}
.pill{font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;white-space:nowrap;display:inline-block}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.new{background:var(--surface-2);color:var(--muted)}
.pill.hot{background:var(--wish-soft);color:var(--wish)}
.where{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);align-self:flex-start}
.where i{width:7px;height:7px;border-radius:50%;background:var(--ok)}

.backbar{display:flex;align-items:center;gap:10px}
.back{border:0;background:var(--surface-2);width:38px;height:38px;border-radius:12px;font-size:18px;flex:none}
.cat-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cat-card{display:flex;flex-direction:column;align-items:flex-start;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px;text-align:left;min-width:0}
.cat-card:hover{border-color:var(--accent-strong)}
.cat-card .icon{width:48px;height:48px}
.cat-card b{font-size:15.5px;line-height:1.2}
.cat-card small{font-size:12.5px;color:var(--muted)}
.brand-group{padding-top:4px}
.brand-group+.brand-group{border-top:1px solid var(--line);margin-top:6px;padding-top:12px}
.brand-name{font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.brand-group .item:first-of-type{border-top:0}
.fallback{display:flex;flex-direction:column;gap:10px}
.fallback h3{font-size:17px}
.fallback .row-btns .btn{font-size:15px;padding:13px 12px}
.photo-prev{width:100%;max-height:260px;object-fit:contain;border-radius:16px;background:var(--surface-2)}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:12px}
.field input:focus{outline:0;border-color:var(--accent-strong)}
.suggest-list{display:flex;flex-direction:column;gap:6px}
.sugg{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px;text-align:left;width:100%}
.sugg .icon{width:36px;height:36px}
.sugg .icon svg{width:22px;height:22px}
.sugg small{display:block;color:var(--muted);font-size:12px}
.sugg em{margin-left:auto;font-style:normal;font-size:12.5px;font-weight:700;color:var(--wish)}

.done-hero{text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;padding-top:12px}
.tick{width:76px;height:76px;border-radius:50%;background:var(--ok-soft);display:grid;place-items:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1);overflow:hidden}
.tick.unlocked{background:var(--accent)}
.tick img{width:100%;height:100%;object-fit:cover}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
.big-bar{height:14px}
.big-count{display:flex;justify-content:space-between;gap:12px;margin-top:8px;font-size:14px;font-variant-numeric:tabular-nums}
.big-count b{font-family:var(--f-display);font-size:22px}
.promise{display:flex;gap:10px;align-items:flex-start;font-size:14.5px}
.promise svg{flex:none;margin-top:2px;color:var(--ok)}

.sheet-wrap{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(10,14,8,.5)}
.sheet{width:100%;max-width:440px;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 18px calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px;animation:up .28s ease-out;max-height:92vh;overflow-y:auto}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 0}
.sel{display:flex;gap:12px;align-items:center;background:var(--surface-2);border-radius:16px;padding:12px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:600}
.toggle input{width:22px;height:22px;accent-color:var(--wish);flex:none}

/* hero wish button */
.wish-cta{position:relative;overflow:hidden;border:0;border-radius:22px;padding:18px 18px 18px 16px;display:flex;align-items:center;gap:14px;width:100%;text-align:left;color:#fff;background:linear-gradient(120deg,#FF3D7F 0%,#E0245E 45%,#FF7A3D 100%);box-shadow:0 12px 28px rgba(217,38,95,.35),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s ease;animation:breathe 2.8s ease-in-out infinite}
.wish-cta:hover{transform:translateY(-2px)}
.wish-cta:active{transform:scale(.98)}
.wish-cta::after{content:"";position:absolute;top:0;bottom:0;left:-40%;width:35%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-18deg);animation:shine 3.2s ease-in-out infinite;pointer-events:none}
.wish-cta .orb{width:54px;height:54px;border-radius:17px;background:rgba(255,255,255,.2);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.4)}
.wish-cta .orb svg{width:30px;height:30px;animation:twinkle 2.8s ease-in-out infinite}
.wish-cta .txt{min-width:0}
.wish-cta .txt b{display:block;font-family:var(--f-display);font-weight:800;font-size:23px;letter-spacing:-.3px;line-height:1.1}
.wish-cta .txt small{display:block;font-size:13px;opacity:.92;margin-top:3px}
.wish-cta .arrow{margin-left:auto;width:42px;height:42px;border-radius:50%;background:#fff;color:#D9265F;display:grid;place-items:center;font-size:20px;font-weight:800;flex:none;box-shadow:0 4px 10px rgba(0,0,0,.15)}
.spark{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.85;animation:twinkle 2.4s ease-in-out infinite;pointer-events:none}
@keyframes shine{0%,55%{left:-40%}100%{left:130%}}
@keyframes breathe{0%,100%{box-shadow:0 12px 28px rgba(217,38,95,.30),inset 0 1px 0 rgba(255,255,255,.35)}50%{box-shadow:0 16px 40px rgba(217,38,95,.55),inset 0 1px 0 rgba(255,255,255,.35)}}
@keyframes twinkle{0%,100%{transform:scale(1) rotate(0)}50%{transform:scale(1.15) rotate(10deg)}}

/* operator */
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13.5px;color:var(--muted)}
.crumbs button{border:0;background:none;padding:2px 0;color:var(--accent-strong);font-weight:700}
.crumbs b{color:var(--ink)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;min-width:0}
.tile span{display:block;font-size:12.5px;color:var(--muted);font-weight:600}
.tile b{display:block;font-family:var(--f-display);font-weight:800;font-size:30px;line-height:1.1;margin-top:4px;font-variant-numeric:tabular-nums}
.rows{display:flex;flex-direction:column}
.row .num.hide-sm{display:none}
.row{display:grid;grid-template-columns:1fr auto 20px;gap:16px;align-items:center;padding:14px 4px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.row:first-child{border-top:0}
.row:hover{background:var(--surface-2)}
.row .name b{display:block;font-size:16px}
.row .name small{display:block;font-size:12.5px;color:var(--muted)}
.row .num{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;font-size:17px}
.row .num small{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.row .chev{color:var(--muted);font-size:20px}
.mix{display:flex;height:8px;border-radius:99px;overflow:hidden;margin-top:8px;max-width:260px;background:var(--surface-2)}
.mix i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.heat-wrap{overflow-x:auto}
table.heat{border-collapse:separate;border-spacing:3px;width:100%;font-variant-numeric:tabular-nums}
table.heat th{font-size:12.5px;color:var(--muted);font-weight:700;text-align:center;padding:4px}
table.heat th.rowh{text-align:left;padding:0}
table.heat th.rowh button{border:0;background:none;text-align:left;padding:4px 0;color:var(--ink);font-weight:700;font-size:13px;line-height:1.2}
table.heat th.rowh small{display:block;color:var(--muted);font-weight:600;font-size:11.5px}
table.heat td{border-radius:9px;text-align:center;font-weight:700;font-size:14px;height:40px;min-width:40px;border:1px solid var(--line)}
table.heat td.peak{outline:2px solid var(--wish);outline-offset:-2px}
.insight{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--wish);border-radius:14px;padding:12px 14px;font-size:14.5px}
.two{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;align-items:start}
.plan{display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.plan .line{display:grid;grid-template-columns:124px 1fr;gap:10px;align-items:baseline}
.tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;text-align:center}
.tag.add{background:var(--ok-soft);color:var(--ok)}
.tag.rm{background:var(--wish-soft);color:var(--wish)}
.tag.time{background:var(--warn-soft);color:var(--warn)}
.req{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.req:first-of-type{border-top:0}
.req.qrow{grid-template-columns:44px 1fr;row-gap:8px}
.req.qrow .row-btns{grid-column:2/-1}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:30;width:min(408px,calc(100% - 32px));box-shadow:0 10px 30px rgba(0,0,0,.25);animation:drop .3s ease-out}
@keyframes drop{from{transform:translate(-50%,-12px);opacity:0}to{transform:translate(-50%,0);opacity:1}}
.foot{font-size:12px;color:var(--muted);text-align:center;margin:0;padding-block:0 16px}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}.row{grid-template-columns:1fr auto 20px}.row .num.hide-sm{display:none}}
@media (max-width:360px){h1{font-size:34px}.fallback .row-btns{flex-direction:column}}
</style>

<div class="app" id="app">
  <div class="demobar pad"><span id="demoLabel">Demo view</span>
    <div class="seg" role="group" aria-label="Demo view">
      <button type="button" id="modeStudent" data-mode="student" aria-pressed="true">Student app</button>
      <button type="button" id="modeOps" data-mode="ops" aria-pressed="false">Operator console</button>
    </div>
  </div>
  <header class="top pad">
    <div class="brand">
      <button class="mark" type="button" data-act="home" aria-label="Home"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z" fill="#17200F"/></svg></button>
      <div style="min-width:0"><b id="brandName">Wish Cabinet</b><small id="brandSub"></small></div>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" id="langEn" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" id="langZh" data-lang="zh" aria-pressed="false">中文</button>
    </div>
  </header>
  <main id="view" class="pad" aria-live="polite"></main>
  <p class="foot pad" id="foot"></p>
</div>
<input type="file" id="photoInput" accept="image/*" class="vh" aria-label="Upload a photo" tabindex="-1">
<div id="sheetRoot"></div>
<div id="toastRoot"></div>

<script>
(function(){
const T = {
  en:{
    brand:"Wish Cabinet", demo:"Demo view", modeStudent:"Student app", modeOps:"Operator console", console:"Operator console",
    scannedAt:"You scanned", h1a:"Didn’t find it?", h1b:"Make a wish.",
    lead:"Pick what you wanted. When enough people at this cabinet wish for it, it’s stocked at the next restock and we message you.",
    makeWish:"Make a wish", wishSub:"3 seconds · tell us what’s missing", here:c=>`Wishes at ${c}`, seeOps:"Demo: see this cabinet in the operator console",
    step1:"Step 1 of 2", step2:"Step 2 of 2", catTitle:"What kind of product?", nProducts:n=>`${n} products`,
    brandTitle:c=>c, brandLead:"Pick the brand and product you wanted.",
    cantFind:"Can’t find it?", cantLead:"Tell us another way. We’ll add it to this cabinet’s list.",
    typeBtn:"Type the brand", photoBtn:"Upload a photo",
    wish:"+ Wish", wished:"Wished ✓", stOk:"Unlocked", of:"of",
    confirmTitle:"Confirm your wish", notify:"Message me when it arrives", cancel:"Cancel", submit:"Make wish",
    typeTitle:"Type the brand or product", typeLabel:"Brand or product name", typePh:"e.g. coconut water",
    already:"Already on the list", tapWish:"Wish", requestNew:q=>`Request “${q}”`, sendReq:"Send request",
    photoTitle:"Your photo", photoName:"Product name (optional)", photoNamePh:"e.g. the name on the label",
    photoNote:"Prototype: the photo stays on this page. In the full version, AI reads the label and the operator checks it.",
    photoBad:"That file isn’t an image. Try a photo of the product.",
    counted:"Wish counted!", unlockedNow:"You unlocked it!", more:n=>`${n} more to unlock`, arriving:"Stocked at the next restock",
    reqDone:"Request sent!", reqLead:"We’ll check it and add it to this cabinet’s list.",
    reqCount:n=>`${n} ${n===1?"person":"people"} at this cabinet asked for this`, reqGoal:"At 10 requests it goes on the wish list.",
    photoReq:"Photo request",
    promiseOn:"We’ll message you when it arrives.", promiseOff:"Check this page after the next restock.",

function seeded(s){ let h=2166136261; for(const ch of s){ h^=ch.charCodeAt(0); h=Math.imul(h,16777619); } return ((h>>>0)%1000)/1000; }

let counts, requests, state, unlocks, stocked;
function fresh(){
  counts = {}; requests = {};
  CABS.forEach(c=>{
    counts[c.id] = {};
    PRODUCTS.forEach(p=>{ counts[c.id][p.id] = Math.round(ZONE_W[c.zone][p.cat] * p.goal * (0.12 + 0.5*seeded(c.id+p.id))); });
    Object.assign(counts[c.id], OVERRIDE[c.id]||{});
    requests[c.id] = (SEED_REQ[c.id]||[]).map(r=>({...r}));
  });
  unlocks = []; stocked = new Set();
  CABS.forEach(c=>PRODUCTS.forEach(p=>{ if(counts[c.id][p.id]>=p.goal) unlocks.push({cab:c.id, id:p.id, at:"today"}); }));
  const keep = state ? {lang:state.lang, mode:state.mode, cab:state.cab} : {lang:"en", mode:"student", cab:"TC-07"};
  state = {...keep, view:"home", cat:null, wished:new Set(), notify:true, pending:null, last:null, lastUnlocked:false, lastReq:null, photo:null, typed:"", site:null, opsCab:null};
}

const siteCat = (sid,cat) => siteCabs(sid).reduce((s,c)=>s+catTotal(c.id,cat),0);
const siteTotal = sid => siteCabs(sid).reduce((s,c)=>s+cabTotal(c.id),0);

function itemRow(cab,p,showBrand=true){
  const right = done(cab,p) ? `<span class="pill ok">${stocked.has(key(cab,p.id))?t("stStock"):t("stOk")}</span>`
    : state.wished.has(key(cab,p.id)) ? `<button class="wish-btn" type="button" disabled>${t("wished")}</button>`
    : `<button class="wish-btn" type="button" data-act="choose" data-id="${p.id}">${t("wish")}</button>`;
  return `<div class="item"><div class="icon">${icon(p)}</div>
    <div class="meta"><b>${esc(L(p))}</b>${showBrand?`<small>${esc(p.brand)}</small>`:""}
      <div class="bar ${done(cab,p)?"done":""}"><i style="width:${pct(cab,p)}%"></i></div>
      <div class="count">${Math.min(cnt(cab,p.id),p.goal)} ${t("of")} ${p.goal}</div></div>${right}</div>`;
}

function opsSite(){

    <div class="card"><h3 style="margin-bottom:4px">${t("cabListTitle")}</h3><div class="rows">${cabs.map(c=>{ const tp=[...PRODUCTS].sort((a,b)=>cnt(c.id,b.id)-cnt(c.id,a.id))[0]; return `

function addRequest(type, name, img){
  const list = requests[state.cab];
  let r = name ? list.find(x=>x.name && norm(x.name)===norm(name)) : null;
  if(r){ r.n += 1; if(img && !r.img) r.img = img; if(type==="photo") r.type="photo"; }
  else { r = {type, name, img, n:1}; list.push(r); }
  state.lastReq = r; state.last = null;
  closeSheet(); state.view="done"; render(); window.scrollTo(0,0);
}
function loadPhoto(file){
  if(!file) return;
  if(!/^image\//.test(file.type)){ toast(t("photoBad")); return; }
  const reader = new FileReader();
  reader.onload = ()=>{
    const img = new Image();
    img.onload = ()=>{
      const s = Math.min(1, 480/Math.max(img.width,img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width*s); cv.height = Math.round(img.height*s);
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      try{ state.photo = cv.toDataURL("image/jpeg",.82); }catch(e){ state.photo = reader.result; }
      openPhotoSheet();
    };
    img.onerror = ()=>toast(t("photoBad"));
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

  const act = el.dataset.act;
  if(act==="close-bg"){ if(e.target===el) closeSheet(); return; }
  if(act==="home"){ if(state.mode==="ops"){ state.site=null; state.opsCab=null; render(); } else go("home"); }
  else if(act==="go"){ go(el.dataset.view); }
  else if(act==="cat"){ state.cat=el.dataset.cat; go("brands"); }
  else if(act==="choose"){ openWishSheet(prod(el.dataset.id)); }
  else if(act==="type"){ openTypeSheet(); }
  else if(act==="photo"){ const f=$("#photoInput"); f.value=""; f.click(); }
  else if(act==="pick-sugg"){ const p=prod(el.dataset.id); if(done(state.cab,p)||state.wished.has(key(state.cab,p.id))){ closeSheet(); state.cat=p.cat; go("brands"); } else openWishSheet(p); }
  else if(act==="send-typed"){ const q=state.typed.trim().slice(0,40); if(!q) return; state.notify=$("#notify").checked; addRequest("text", q, null); }
  else if(act==="send-photo"){ state.notify=$("#notify").checked; addRequest("photo", $("#photoName").value.trim().slice(0,40), state.photo); }
  else if(act==="close"){ closeSheet(); }
  else if(act==="submit"){
    const p = state.pending, cab = state.cab;
    state.notify = $("#notify").checked;
    const was = cnt(cab,p.id) >= p.goal;
    counts[cab][p.id] = cnt(cab,p.id) + 1; state.wished.add(key(cab,p.id));
    state.last = p.id; state.lastReq = null; state.lastUnlocked = !was && counts[cab][p.id] >= p.goal;
    if(state.lastUnlocked) unlocks.unshift({cab, id:p.id, at:"now"});
    closeSheet(); state.view="done"; render(); window.scrollTo(0,0);
  }
  else if(act==="share"){
    const name = state.lastReq ? (state.lastReq.name || t("photoReq")) : L(prod(state.last));
    const left = state.lastReq ? Math.max(0,REQ_GOAL-state.lastReq.n) : Math.max(0,prod(state.last).goal-cnt(state.cab,state.last));
    const text = t("shareText")(name, left);
    try{ navigator.clipboard.writeText(text).then(()=>toast(t("copied")), ()=>toast(text)); }catch(_){ toast(text); }
  }
  else if(act==="mark-stocked"){ stocked.add(key(el.dataset.cab, el.dataset.id)); render(); toast(t("stockedToast")(cabLabel(cabOf(el.dataset.cab)))); }
  else if(act==="ops-this"){ state.mode="ops"; state.site=cabOf(state.cab).site; state.opsCab=state.cab; closeSheet(); setHash(); render(); window.scrollTo(0,0); }
  else if(act==="ops-all"){ state.site=null; state.opsCab=null; render(); window.scrollTo(0,0); }
  else if(act==="ops-site"){ state.site=el.dataset.site; state.opsCab=null; render(); window.scrollTo(0,0); }
  else if(act==="ops-cab"){ state.opsCab=el.dataset.cab; state.site=cabOf(el.dataset.cab).site; render(); window.scrollTo(0,0); }
  else if(act==="open-student"){ state.cab=el.dataset.cab; state.mode="student"; setHash(); go("home"); toast(t("now")(cabLabel(cabOf(state.cab)))); }
  else if(act==="reset"){ fresh(); render(); window.scrollTo(0,0); toast(t("resetDone")); }
});
$("#photoInput").addEventListener("change", e=>loadPhoto(e.target.files && e.target.files[0]));
let composing=false;
document.addEventListener("compositionstart", e=>{ if(e.target.id==="typed") composing=true; });
document.addEventListener("compositionend", e=>{ if(e.target.id==="typed"){ composing=false; state.typed=e.target.value; refreshType(); } });
document.addEventListener("input", e=>{ if(e.target.id==="typed" && !composing && !e.isComposing){ state.typed=e.target.value; refreshType(); } });
document.addEventListener("keydown", e=>{ if(e.key==="Escape" && $("#sheetRoot").innerHTML) closeSheet(); if(e.key==="Enter" && e.target.id==="typed"){ const b=$("#sendTyped"); if(b&&!b.disabled) b.click(); } });
window.addEventListener("hashchange", ()=>{ readHash(); render(); });

readHash();
render();
})();
</script>
